[package]
name = "soup-engine"
version = "0.1.0"
edition = "2021"
description = "soup-engine —— 与具体游戏无关的实时对战服务器框架(Rust)。UDP 可靠传输 + UDS 对接 Go 逻辑服。"

# library crate:soup-engine 框架本体,库根 src/lib.rs。
[lib]
name = "soup_engine"
path = "src/lib.rs"

[dependencies]
# tokio:异步运行时。先用 full,等结构稳定再裁剪成极致轻量。
tokio = { version = "1", features = ["full"] }
# bytes:缓冲与分帧的基础。
bytes = "1"
# socket2:SO_REUSEPORT 等多 socket 预绑定。
socket2 = { version = "0.5", features = ["all"] }
# rand:握手随机源、seed 生成。
rand = "0.8"
# hmac + sha2:握手 challenge 校验与包 HMAC(防伪造)。
hmac = "0.12"
sha2 = "0.10"
# tracing:结构化日志,惰性求值,热路径零开销。
tracing = "0.1"
tokio-tungstenite = "0.30.0"
futures-util = "0.3.33"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "engineload"
path = "examples/engineload.rs"
